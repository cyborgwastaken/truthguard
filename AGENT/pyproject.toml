[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truthguard-agent"
version = "0.1.0"
description = "TruthGuard domain schemas, agents, orchestrator and resolution engine"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["truthguard_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
