name: truthguard

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: truthguard-db
    environment:
      POSTGRES_USER: truthguard
      POSTGRES_PASSWORD: truthguard
      POSTGRES_DB: truthguard
    ports:
      # Host port 5433 (not 5432) so it does not clash with a Postgres already installed on your machine.
      - "${TRUTHGUARD_DB_PORT:-5433}:5432"
    volumes:
      - truthguard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthguard -d truthguard"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  truthguard-pgdata:
